name: Cleanup assistant two-card CSS

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-assistant-two-card-css.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy fixed-height panel CSS
        run: python scripts/cleanup_assistant_two_card_css.py

      - name: Commit CSS cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No CSS cleanup needed.'
          else
            git commit -m 'Finalize separated assistant card layout'
            git push origin main
          fi
