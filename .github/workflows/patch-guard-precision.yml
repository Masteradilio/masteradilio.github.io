name: Patch recruiter guard precision

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-guard-precision.yml'
      - 'scripts/patch_recruiter_guard_precision.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guard precision patch
        run: python scripts/patch_recruiter_guard_precision.py

      - name: Validate Worker as ES module
        run: |
          cp cloudflare/adilio-career-assistant.js /tmp/adilio-career-assistant.mjs
          node --check /tmp/adilio-career-assistant.mjs
          grep -q "SERVICE_VERSION = '2026.16'" cloudflare/adilio-career-assistant.js
          grep -q "const AI_ENGINEER_FIT = \['squad_forge_SE'\]" cloudflare/adilio-career-assistant.js
          grep -q 'function isFitQuestion' cloudflare/adilio-career-assistant.js
          grep -q 'function missesExplicitTechnologyReference' cloudflare/adilio-career-assistant.js
          grep -q 'technology_not_addressed' cloudflare/adilio-career-assistant.js
          grep -q "q.includes('local-first')" cloudflare/adilio-career-assistant.js
          grep -q 'ragAgentSummaryDeploymentUpgrade' cloudflare/adilio-career-assistant.js
          grep -q 'Explicitly name Kubernetes in the answer' cloudflare/adilio-career-assistant.js
          grep -q 'Answer the LlamaIndex question explicitly' cloudflare/adilio-career-assistant.js
          grep -q 'Do not infer that an architecture lacks scalability' cloudflare/adilio-career-assistant.js

      - name: Commit Worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/adilio-career-assistant.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Finalize recruiter-facing factual precision'
          git push origin HEAD:main
