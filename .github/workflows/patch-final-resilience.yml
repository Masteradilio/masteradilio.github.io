name: Patch recruiter assistant final resilience

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-final-resilience.yml'
      - 'scripts/patch_recruiter_final_resilience.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: career-assistant-final-resilience-20260822
          fetch-depth: 0

      - name: Load patch script from main
        run: |
          git fetch origin main
          git show origin/main:scripts/patch_recruiter_final_resilience.py > /tmp/patch_recruiter_final_resilience.py
          python -m py_compile /tmp/patch_recruiter_final_resilience.py

      - name: Apply final resilience hardening
        run: python /tmp/patch_recruiter_final_resilience.py

      - name: Validate Worker as Cloudflare ES module
        run: |
          cp cloudflare/adilio-career-assistant.js /tmp/adilio-career-assistant.mjs
          node --check /tmp/adilio-career-assistant.mjs
          grep -q "SERVICE_VERSION = '2026.13'" cloudflare/adilio-career-assistant.js
          grep -q 'gateway_attempts' cloudflare/adilio-career-assistant.js
          grep -q 'FINALIZATION TASK' cloudflare/adilio-career-assistant.js
          grep -q "use implemented rather than deployed" cloudflare/adilio-career-assistant.js
          ! grep -q 'function localFallback' cloudflare/adilio-career-assistant.js

      - name: Commit patched Worker to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/adilio-career-assistant.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Harden recruiter assistant final answer recovery'
          git push origin HEAD:career-assistant-final-resilience-20260822

# trigger: final resilience 2026-08-22
