name: Refine assistant architecture panel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refine-assistant-architecture-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refine architecture panel
        run: python scripts/refine_assistant_architecture_panel.py

      - name: Commit frontend refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No frontend changes needed.'
          else
            git commit -m 'Refine RAG architecture panel presentation'
            git push origin main
          fi
