name: Patch final recruiter polish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-final-polish.yml'
      - 'scripts/patch_recruiter_final_polish.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply attribution polish
        run: python scripts/patch_recruiter_final_polish.py

      - name: Validate Worker
        run: |
          cp cloudflare/adilio-career-assistant.js /tmp/adilio-career-assistant.mjs
          node --check /tmp/adilio-career-assistant.mjs
          grep -q "For BANPARÁ RAG work" cloudflare/adilio-career-assistant.js
          grep -q "banparaRagDeploymentUpgrade" cloudflare/adilio-career-assistant.js

      - name: Commit Worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/adilio-career-assistant.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Prevent professional RAG deployment overclaims'
          git push origin HEAD:main
