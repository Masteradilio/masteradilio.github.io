name: Portfolio professionalization

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'scripts/patch_portfolio.py'
      - 'scripts/patch_portfolio_v2.py'
      - 'scripts/patch_portfolio_final.py'
      - 'scripts/generate_social_card.py'
      - 'src/input.css'
      - '.github/workflows/portfolio-professionalization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-professionalization-20260822

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply recruiter and security improvements
        run: |
          python scripts/patch_portfolio.py
          python scripts/patch_portfolio_v2.py
          python scripts/patch_portfolio_final.py

      - name: Build production Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -i ./src/input.css -o ./assets/tailwind.css --minify --content './index.html'

      - name: Generate Open Graph image
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/generate_social_card.py

      - name: Verify generated site assets
        run: |
          test -s assets/tailwind.css
          test -s assets/portfolio-og.png
          ! grep -q 'cdn.tailwindcss.com' index.html
          ! grep -q 'Qwen 2.5 Coder 27B' index.html
          ! grep -q 'LlamaIndex</span>' index.html
          ! grep -q 'Enterprise semantic governance and RAG framework governed by ontologies and Knowledge Graphs' index.html
          grep -q 'DOMPurify.sanitize' index.html
          grep -q 'property="og:title"' index.html
          grep -q 'conversationHistory.slice(0, -1).slice(-4)' index.html
          grep -q 'if (!faq.utility) continue;' index.html
          grep -q 'data-i18n="seniority_badge"' index.html
          grep -q '15+ years in financial services' index.html
          grep -q 'Featured • AI Engineering' index.html
          grep -q 'Featured • Agentic RAG' index.html
          grep -q 'Featured • ML/MLOps' index.html
          grep -q '473.791 registros' index.html
          grep -q '96-case EVAL benchmark' index.html
          grep -q 'ROC-AUC 0,9818' index.html
          grep -q 'LightGBM + Isolation Forest' index.html

      - name: Commit generated portfolio update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/tailwind.css assets/portfolio-og.png
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'feat: finalize recruiter-facing portfolio evidence'
            git push origin HEAD:portfolio-professionalization-20260822
          fi
