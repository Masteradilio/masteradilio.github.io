name: Portfolio quality checks

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'cloudflare/**'
      - 'docs/RAG_EVAL_SUITE.md'
      - 'scripts/generate_social_card.py'
      - 'src/input.css'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/portfolio-professionalization.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'cloudflare/**'
      - 'docs/RAG_EVAL_SUITE.md'
      - 'scripts/**'
      - 'src/input.css'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/portfolio-professionalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate recruiter-facing contracts
        run: |
          test -s index.html
          test -s assets/tailwind.css
          test -s assets/portfolio-og.png
          test -s assets/cv_adilio_farias_en.html
          test -s assets/cv_adilio_farias_pt.html
          test -s cloudflare/adilio-career-assistant.js
          test -s docs/RAG_EVAL_SUITE.md
          test -s robots.txt
          test -s sitemap.xml

          ! grep -q 'cdn.tailwindcss.com' index.html
          ! grep -q 'Qwen 2.5 Coder 27B' index.html
          ! grep -q 'AI Engineer and AI Engineer' assets/cv_adilio_farias_en.html
          ! grep -q 'Engenheiro de IA e Engenheiro de IA' assets/cv_adilio_farias_pt.html

          grep -q 'Adilio Farias | AI Engineer & Senior Data Scientist' index.html
          grep -q 'property="og:title"' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'DOMPurify.sanitize' index.html
          grep -q 'conversationHistory.slice(0, -1).slice(-4)' index.html
          grep -q 'data-i18n-placeholder="chat_placeholder"' index.html
          grep -q 'Featured • AI Engineering' index.html
          grep -q 'Featured • Agentic RAG' index.html
          grep -q 'Featured • ML/MLOps' index.html
          grep -q 'AI ENGINEER | SENIOR DATA SCIENTIST' assets/cv_adilio_farias_en.html
          grep -q 'ENGENHEIRO DE IA | CIENTISTA DE DADOS SÊNIOR' assets/cv_adilio_farias_pt.html

          grep -q "SERVICE_VERSION = '2026.10'" cloudflare/adilio-career-assistant.js
          grep -q 'removeCrossProjectClaims' cloudflare/adilio-career-assistant.js
          grep -q 'containsReasoningLeak' cloudflare/adilio-career-assistant.js
          grep -q 'containsPortfolioProfessionalMix' cloudflare/adilio-career-assistant.js
          grep -q 'containsKnownPortfolioOverclaim' cloudflare/adilio-career-assistant.js
          grep -q 'stripModelArtifacts' cloudflare/adilio-career-assistant.js
          grep -q 'filterSourcesForReply' cloudflare/adilio-career-assistant.js
          grep -q 'repairAnswer' cloudflare/adilio-career-assistant.js
          grep -q 'grounded-local-fallback' cloudflare/adilio-career-assistant.js
          grep -q 'openrouter/free' cloudflare/adilio-career-assistant.js
          grep -q 'openai/gpt-oss-20b:free' cloudflare/adilio-career-assistant.js
          grep -q 'nvidia/nemotron-nano-9b-v2:free' cloudflare/adilio-career-assistant.js
          grep -q 'not a production security boundary' cloudflare/adilio-career-assistant.js
          grep -q '100% synthetic data' cloudflare/adilio-career-assistant.js
          grep -q 'NEVER create a "Sources"' cloudflare/adilio-career-assistant.js
          grep -q 'reasoning: { exclude: true }' cloudflare/adilio-career-assistant.js

          grep -q '10/10 pass criteria' docs/RAG_EVAL_SUITE.md
          grep -q 'thinking process' docs/RAG_EVAL_SUITE.md
          grep -q 'employer metrics are never attached to portfolio projects' docs/RAG_EVAL_SUITE.md

      - name: Validate Worker as Cloudflare ES module
        run: |
          cp cloudflare/adilio-career-assistant.js /tmp/adilio-career-assistant.mjs
          node --check /tmp/adilio-career-assistant.mjs
          test "$(grep -c '^async function callOpenRouter' cloudflare/adilio-career-assistant.js)" -eq 1
          test "$(grep -c '^function modelOrder' cloudflare/adilio-career-assistant.js)" -eq 1
          test "$(grep -c '^function explicitFileRequest' cloudflare/adilio-career-assistant.js)" -eq 1
          test "$(grep -c '^async function executeFileLookup' cloudflare/adilio-career-assistant.js)" -eq 1

      - name: Validate HTML structure and bilingual keys
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          root = Path('.')
          text = Path('index.html').read_text(encoding='utf-8')

          class PortfolioParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.local_refs = []
                  self.target_blank = []
                  self.project_links = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get('id'):
                      self.ids.append(data['id'])
                  for attr in ('href', 'src'):
                      value = data.get(attr)
                      if not value:
                          continue
                      if value.startswith(('http://', 'https://')):
                          if 'github.com/Masteradilio/' in value:
                              self.project_links.append(value)
                          continue
                      if value.startswith(('#', 'mailto:', 'javascript:', 'data:')):
                          continue
                      self.local_refs.append(value.split('#', 1)[0].split('?', 1)[0])
                  if data.get('target') == '_blank':
                      self.target_blank.append(data)

          parser = PortfolioParser()
          parser.feed(text)

          duplicates = sorted({value for value in parser.ids if parser.ids.count(value) > 1})
          assert not duplicates, f'Duplicate HTML ids: {duplicates}'

          required_ids = {'hero', 'sobre', 'projetos', 'forge-process', 'skills', 'assistente', 'contato'}
          missing_ids = required_ids.difference(parser.ids)
          assert not missing_ids, f'Missing required sections: {sorted(missing_ids)}'

          missing_local = sorted({ref for ref in parser.local_refs if ref and not (root / ref).exists()})
          assert not missing_local, f'Missing local assets: {missing_local}'

          unsafe_blank = []
          for attrs in parser.target_blank:
              rel = set((attrs.get('rel') or '').split())
              if not {'noopener', 'noreferrer'}.issubset(rel):
                  unsafe_blank.append(attrs.get('href') or attrs.get('src') or '<unknown>')
          assert not unsafe_blank, f'target=_blank links missing rel=noopener noreferrer: {unsafe_blank}'

          expected_projects = {
              'squad_forge_SE',
              'time_series_predict',
              'ontology_rag_guardrail',
              'rag_agent_datasus',
              'credit_risk_model',
              'credit_scoring_model',
              'sentinel_pix',
          }
          linked_projects = {
              name for name in expected_projects
              if any(f'/Masteradilio/{name}' in link for link in parser.project_links)
          }
          assert linked_projects == expected_projects, f'Missing project links: {sorted(expected_projects - linked_projects)}'

          referenced_keys = set(re.findall(r'data-i18n="([A-Za-z0-9_]+)"', text))
          referenced_keys.update(re.findall(r'data-i18n-placeholder="([A-Za-z0-9_]+)"', text))

          start = text.index('const translations = {')
          pt_start = text.index('pt: {', start)
          en_start = text.index('en: {', pt_start)
          end = text.index('\n    };', en_start)
          pt_block = text[pt_start:en_start]
          en_block = text[en_start:end]
          key_re = re.compile(r'^\s*([A-Za-z0-9_]+):', re.M)
          pt_keys = set(key_re.findall(pt_block))
          en_keys = set(key_re.findall(en_block))
          assert not (referenced_keys - pt_keys), f'Missing PT translations: {sorted(referenced_keys - pt_keys)}'
          assert not (referenced_keys - en_keys), f'Missing EN translations: {sorted(referenced_keys - en_keys)}'

          json_ld_match = re.search(
              r'<script type="application/ld\+json">\s*(\{.*?\})\s*</script>',
              text,
              re.S,
          )
          assert json_ld_match, 'Schema.org JSON-LD block missing'
          profile = json.loads(json_ld_match.group(1))
          assert profile.get('@type') == 'Person'
          assert profile.get('jobTitle') == 'AI Engineer and Senior Data Scientist'

          assert text.count('Featured • ') == 3, 'Expected exactly three Featured project badges'
          print('Portfolio structural validation passed.')
          PY

      - name: Verify compiled Tailwind CSS is current
        run: |
          npx --yes tailwindcss@3.4.17 -i ./src/input.css -o /tmp/tailwind.css --minify --content './index.html'
          cmp -s /tmp/tailwind.css assets/tailwind.css || {
            echo 'assets/tailwind.css is stale. Rebuild it before committing.'
            exit 1
          }
