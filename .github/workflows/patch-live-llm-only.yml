name: Patch recruiter assistant to live LLM only

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-live-llm-only.yml'
      - 'scripts/patch_live_llm_only.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: career-assistant-live-llm-only-20260822
          fetch-depth: 0

      - name: Load patch script from main
        run: |
          git fetch origin main
          git show origin/main:scripts/patch_live_llm_only.py > /tmp/patch_live_llm_only.py
          python -m py_compile /tmp/patch_live_llm_only.py

      - name: Apply live-LLM hardening
        run: |
          python /tmp/patch_live_llm_only.py

      - name: Validate Cloudflare Worker as ES module
        run: |
          cp cloudflare/adilio-career-assistant.js /tmp/adilio-career-assistant.mjs
          node --check /tmp/adilio-career-assistant.mjs
          test "$(grep -c '^async function callOpenRouter' cloudflare/adilio-career-assistant.js)" -eq 1
          test "$(grep -c '^function unavailableReply' cloudflare/adilio-career-assistant.js)" -eq 1
          ! grep -q 'function localFallback' cloudflare/adilio-career-assistant.js
          ! grep -q 'grounded-local-fallback' cloudflare/adilio-career-assistant.js
          ! grep -q 'localFallback(question, language, plan, repos)' cloudflare/adilio-career-assistant.js
          grep -q "SERVICE_VERSION = '2026.11'" cloudflare/adilio-career-assistant.js
          grep -q "generation_mode: 'llm-rag'" cloudflare/adilio-career-assistant.js
          grep -q 'containsProfessionalAttributionError' cloudflare/adilio-career-assistant.js
          grep -q 'containsDataScopeOverclaim' cloudflare/adilio-career-assistant.js

      - name: Commit patched files to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/workflows/portfolio-professionalization.yml || true
          git add cloudflare/adilio-career-assistant.js docs/RAG_EVAL_SUITE.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Require live LLM generation and harden recruiter answers'
          git push origin HEAD:career-assistant-live-llm-only-20260822
