name: Apply assistant two-card layout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-assistant-two-card-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply two-card assistant layout
        run: python scripts/separate_assistant_architecture_card.py

      - name: Commit frontend layout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No frontend changes needed.'
          else
            git commit -m 'Separate RAG assistant and architecture cards'
            git push origin main
          fi
