name: Fix duplicated Worker declarations

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-worker-duplicate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicated declarations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cloudflare/adilio-career-assistant.js')
          text = path.read_text(encoding='utf-8')

          marker = 'async function callOpenRouter('
          positions = []
          start = 0
          while True:
              idx = text.find(marker, start)
              if idx < 0:
                  break
              positions.append(idx)
              start = idx + 1

          if len(positions) != 2:
              raise SystemExit(f'Expected exactly 2 callOpenRouter declarations before patch, found {len(positions)}')

          duplicate_start = positions[1]
          duplicate_end = text.find('async function repairAnswer(', duplicate_start)
          if duplicate_end < 0:
              raise SystemExit('Could not find repairAnswer after duplicated block')

          cleaned = text[:duplicate_start] + text[duplicate_end:]

          expected_once = [
              'async function callOpenRouter(',
              'function modelOrder(',
              'function explicitFileRequest(',
              'async function executeFileLookup('
          ]
          for token in expected_once:
              count = cleaned.count(token)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence of {token!r} after patch, found {count}')

          path.write_text(cleaned, encoding='utf-8')
          PY

      - name: Validate as ES module
        run: |
          cp cloudflare/adilio-career-assistant.js /tmp/adilio-career-assistant.mjs
          node --check /tmp/adilio-career-assistant.mjs
          test "$(grep -c '^async function callOpenRouter' cloudflare/adilio-career-assistant.js)" -eq 1
          test "$(grep -c '^function modelOrder' cloudflare/adilio-career-assistant.js)" -eq 1

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/adilio-career-assistant.js
          git commit -m 'Fix duplicate Worker declarations'
          git push origin HEAD:main

# one-time trigger
