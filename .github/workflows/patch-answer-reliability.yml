name: Patch recruiter answer reliability

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-answer-reliability.yml'
      - 'scripts/patch_answer_reliability.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: career-assistant-answer-reliability-20260822
          fetch-depth: 0

      - name: Load patch script from main
        run: |
          git fetch origin main
          git show origin/main:scripts/patch_answer_reliability.py > /tmp/patch_answer_reliability.py
          python -m py_compile /tmp/patch_answer_reliability.py

      - name: Apply answer reliability hardening
        run: python /tmp/patch_answer_reliability.py

      - name: Validate Cloudflare Worker as ES module
        run: |
          cp cloudflare/adilio-career-assistant.js /tmp/adilio-career-assistant.mjs
          node --check /tmp/adilio-career-assistant.mjs
          test "$(grep -c '^async function callOpenRouter' cloudflare/adilio-career-assistant.js)" -eq 1
          test "$(grep -c '^function needsRepair' cloudflare/adilio-career-assistant.js)" -eq 1
          grep -q 'looksIncompleteAnswer' cloudflare/adilio-career-assistant.js
          grep -q 'missesRequiredProfessionalLead' cloudflare/adilio-career-assistant.js
          grep -q 'conversationalHistory' cloudflare/adilio-career-assistant.js
          ! grep -q 'function localFallback' cloudflare/adilio-career-assistant.js
          ! grep -q 'grounded-local-fallback' cloudflare/adilio-career-assistant.js

      - name: Commit patched files to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/adilio-career-assistant.js docs/RAG_EVAL_SUITE.md
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Harden live recruiter answer completeness and retries'
          git push origin HEAD:career-assistant-answer-reliability-20260822
