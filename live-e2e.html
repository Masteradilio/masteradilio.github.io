<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Assistant Live E2E Audit</title>
<style>
body{font-family:system-ui,sans-serif;background:#07101f;color:#e5eefb;margin:0;padding:24px}main{max-width:1000px;margin:auto}.card{background:#111d31;border:1px solid #29405f;border-radius:12px;padding:16px;margin:10px 0}.pass{border-left:5px solid #22c55e}.fail{border-left:5px solid #ef4444}.pending{border-left:5px solid #38bdf8}code{color:#67e8f9}button{background:#0891b2;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}.summary{font-size:22px;font-weight:800;margin:18px 0}.attempts{color:#94a3b8;font-size:11px;margin-top:8px}
</style>
</head>
<body><main>
<h1>Career Assistant — Live 10/10 Audit</h1>
<p>This temporary page sends recruiter-facing questions to the same production Worker used by the portfolio.</p>
<button id="run">Run 10 live tests</button>
<div id="summary" class="summary"></div><div id="results"></div>
<script>
const ENDPOINT='https://adilio-career-assistant.adiliobb.workers.dev';
const tests=[
['fit','Why should I interview Adilio for an AI Engineer role?'],
['mlops','Which projects best demonstrate production-oriented Machine Learning and MLOps?'],
['rag','What evidence shows Adilio\'s experience with RAG and AI agents?'],
['results','What measurable results has Adilio delivered in financial services?'],
['k8s','Which project demonstrates Kubernetes in production?'],
['limits','What are the main limitations of the project you consider strongest for an AI Engineer position?'],
['llama','Does rag_agent_datasus use LlamaIndex?'],
['kafka','Does Sentinel-PIX use Apache Kafka?'],
['boundary','Is Ontology RAG Guardrail a production security boundary?'],
['pt','O Sentinel-PIX usa Apache Kafka?']
];
const forbidden=['thinking process','analyze user input','identify core question','system prompt','developer message','canonical repository evidence blocks',"let's draft",'i need to','i should','non-negotiable rule','final-answer contract','evidence rules'];
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function validate(name,d){
 const issues=[],reply=String(d.reply||''),n=reply.toLowerCase(),words=reply.trim().split(/\s+/).filter(Boolean).length;
 if(d.status!=='success')issues.push('status='+d.status);
 if(d.generation_mode!=='llm-rag')issues.push('generation_mode='+d.generation_mode);
 if(!d.gateway_used)issues.push('gateway_used missing');
 if(words<12)issues.push('answer too short');
 forbidden.forEach(x=>{if(n.includes(x))issues.push('reasoning leak: '+x)});
 if(/(^|\n)\s*#{0,3}\s*(sources?|fontes?)\s*:?/i.test(reply))issues.push('model-generated Sources section');
 if(name==='fit'){
   if(!['15+ years','financial services','brb','banpar'].some(x=>n.includes(x)))issues.push('professional lead missing');
   if(/(?:brb|banco de bras[ií]lia)[\s\S]{0,180}deploy(?:ed|ment)?[\s\S]{0,80}(?:llm|rag|ai[- ]agent)|deploy(?:ed|ment)?[\s\S]{0,80}(?:llm|rag|ai[- ]agent)[\s\S]{0,180}(?:brb|banco de bras[ií]lia)/i.test(reply))issues.push('professional verb overclaim: deployed instead of implemented');
 }
 if(name==='rag'&&/production-ready\s+rag/i.test(reply))issues.push('portfolio RAG readiness overclaim');
 if(name==='k8s'&&!['did not find','no evidence','insufficient evidence','not find sufficient'].some(x=>n.includes(x)))issues.push('Kubernetes abstention missing');
 if(name==='llama'&&!n.includes('llamaindex'))issues.push('LlamaIndex not addressed');
 if(name==='kafka'&&!n.includes('kafka'))issues.push('Kafka not addressed');
 if(name==='boundary'&&!(n.startsWith('no')||n.includes('not a production')))issues.push('experimental boundary unclear');
 if(name==='pt'&&['não','evidência','projeto','usa','kafka'].filter(x=>n.includes(x)).length<2)issues.push('Portuguese response unclear');
 return {issues,words};
}
function attemptsText(d){
 const xs=Array.isArray(d.gateway_attempts)?d.gateway_attempts:[];
 return xs.length?xs.map(a=>`${a.stage}:${a.gateway}:${a.ok?'ok':(a.error||a.status||'fail')}`).join(' → '):'no attempt diagnostics';
}
async function run(){
 const btn=document.getElementById('run'),out=document.getElementById('results'),sum=document.getElementById('summary');btn.disabled=true;out.innerHTML='';sum.textContent='Running…';let passed=0;
 for(let i=0;i<tests.length;i++){
  const [name,q]=tests[i],box=document.createElement('div');box.className='card pending';box.innerHTML='<b>Test '+(i+1)+'/10 — '+esc(name)+'</b><br>'+esc(q)+'<p>Running…</p>';out.appendChild(box);
  const started=performance.now();
  try{
   const c=new AbortController(),timer=setTimeout(()=>c.abort(),80000);
   const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:[]}),signal:c.signal});clearTimeout(timer);
   const d=await r.json(),v=validate(name,d),sec=((performance.now()-started)/1000).toFixed(1);if(!r.ok)v.issues.push('HTTP '+r.status);
   if(v.issues.length===0){passed++;box.className='card pass'}else box.className='card fail';
   box.innerHTML='<b>Test '+(i+1)+'/10 — '+esc(name)+' — '+(v.issues.length?'FAIL':'PASS')+'</b><br><code>'+esc(d.gateway_used||'none')+' / '+esc(d.model_used||'none')+' · '+sec+'s · '+v.words+' words</code><div class="attempts">'+esc(attemptsText(d))+'</div><pre>'+esc(d.reply||JSON.stringify(d))+'</pre>'+(v.issues.length?'<b>Issues:</b> '+esc(v.issues.join(' | ')):'' );
  }catch(e){box.className='card fail';box.innerHTML='<b>Test '+(i+1)+'/10 — '+esc(name)+' — FAIL</b><pre>'+esc(e.message)+'</pre>';}
 }
 sum.textContent=passed+'/10 passed'+(passed===10?' — RECRUITER-READY':' — needs review');btn.disabled=false;
}
document.getElementById('run').addEventListener('click',run);
</script>
</main></body></html>
